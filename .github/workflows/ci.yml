name: CI

# Minutes budget: this repository is private, so hosted Linux minutes count
# once, Windows twice and macOS ten times against 2,000 a month. Linux and
# Windows therefore run on self-hosted runners (registered from the developer
# machine, see docs/contributing/ci-runners.md), which GitHub does not bill, using the
# Qt installed there. macOS has no self-hosted counterpart and runs only when
# asked for or on a tag. Once the repository is public, hosted runners are
# free and the `runs-on` lines can go back to GitHub's images.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux / Behavior ${{ matrix.behavior }}
    # A self-hosted Linux runner provides QMLTUI_QT_LINUX (the Qt prefix) in
    # its .env file; Ninja and CMake come from the machine.
    runs-on: [self-hosted, linux]
    strategy:
      fail-fast: false
      matrix:
        behavior: [ON, OFF]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$QMLTUI_QT_LINUX"
          -DQMLTUI_BUILD_TESTS=ON
          -DQMLTUI_BUILD_EXAMPLES=ON
          -DQMLTUI_ENABLE_RUNNER=ON
          -DQMLTUI_ENABLE_PRIVATE_QT=${{ matrix.behavior }}
          -DQMLTUI_ENABLE_PTY_VIEW=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

  coverage:
    name: coverage (linux / clang / llvm-cov)
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build-coverage -G Ninja
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_PREFIX_PATH="$QMLTUI_QT_LINUX"
          -DQMLTUI_BUILD_TESTS=ON
          -DQMLTUI_BUILD_EXAMPLES=ON
          -DQMLTUI_ENABLE_RUNNER=ON
          -DQMLTUI_ENABLE_PRIVATE_QT=ON
          -DQMLTUI_ENABLE_PTY_VIEW=ON
          -DQMLTUI_ENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build-coverage --parallel 4

      - name: Run tests and generate coverage report
        run: cmake --build build-coverage --target coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build-coverage/coverage/html/
            build-coverage/coverage/summary.md
            build-coverage/coverage/summary.txt
            build-coverage/coverage/summary.json
            build-coverage/coverage/lcov.info
          retention-days: 14

  windows:
    name: windows / Behavior ON
    # A self-hosted Windows runner provides QMLTUI_QT_WINDOWS (the msvc2022_64
    # prefix) in its .env file and has Visual Studio 2022 installed. Behavior
    # gating is exercised on Linux; one Windows configuration is enough.
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$env:QMLTUI_QT_WINDOWS"
          -DQMLTUI_BUILD_TESTS=ON
          -DQMLTUI_BUILD_EXAMPLES=ON
          -DQMLTUI_ENABLE_RUNNER=ON
          -DQMLTUI_ENABLE_PRIVATE_QT=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        shell: pwsh
        run: |
          # DLLs are found through PATH on Windows: Qt's bin plus every build
          # directory that holds one.
          $dllDirs = Get-ChildItem -Path build -Recurse -Filter *.dll | ForEach-Object { $_.DirectoryName } | Sort-Object -Unique
          $env:PATH = "$env:QMLTUI_QT_WINDOWS\bin;" + ($dllDirs -join ';') + ";$env:PATH"
          $env:QML2_IMPORT_PATH = "$PWD\build\qml"
          $env:QML_IMPORT_PATH = "$PWD\build\qml"
          $env:QT_FORCE_STDERR_LOGGING = "1"
          ctest --test-dir build --output-on-failure

  macos:
    name: macos / Behavior ON (on demand and tags)
    # Hosted macOS minutes bill at ten times; run this row only when asked
    # for or when a release tag is pushed.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQMLTUI_BUILD_TESTS=ON
          -DQMLTUI_BUILD_EXAMPLES=ON
          -DQMLTUI_ENABLE_RUNNER=ON
          -DQMLTUI_ENABLE_PRIVATE_QT=ON
          -DQMLTUI_ENABLE_PTY_VIEW=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  quickstart:
    name: quickstart (FetchContent, standalone)
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Configure exactly as a newcomer would, against this tree
        # FETCHCONTENT_SOURCE_DIR_QMLTUI is CMake's standard override for a
        # declared dependency; the quickstart files themselves are unchanged.
        run: >
          cmake -S examples/quickstart -B build-qs -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$QMLTUI_QT_LINUX"
          -DFETCHCONTENT_SOURCE_DIR_QMLTUI=${{ github.workspace }}

      - name: Build
        run: cmake --build build-qs --parallel 4

      - name: Smoke-run
        # No terminal here: the app must start, render, and keep running until
        # the timeout kills it (exit 124). Any crash or QML load error exits early.
        run: |
          set +e
          timeout 3 ./build-qs/hello_qmltui < /dev/null > run.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "hello_qmltui exited early with code $code"; cat run.log; exit 1
          fi
          grep -q "Welcome" run.log || { echo "no rendered frame in output"; cat run.log | head -c 2000; exit 1; }

  reuse:
    name: REUSE licensing compliance
    # About one hosted Linux minute.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5
