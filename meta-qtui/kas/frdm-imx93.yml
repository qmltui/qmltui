header:
  version: 14
  includes:
    - meta-qtui/kas/base.yml

machine: imx93-11x11-lpddr4x-evk

repos:
  meta-freescale:
    url: "https://github.com/Freescale/meta-freescale.git"
    branch: "scarthgap"
    path: "layers/meta-freescale"

  meta-arm:
    url: "https://git.yoctoproject.org/meta-arm"
    branch: "scarthgap"
    path: "layers/meta-arm"
    layers:
      meta-arm:
      meta-arm-toolchain:

local_conf_header:
  fsl_config: |
    ACCEPT_FSL_EULA = "1"
    IMAGE_FSTYPES += "wic.zst tar.bz2"
    WKS_FILE = "imx-imx-boot-bootpart.wks.in"
    KERNEL_DEVICETREE:append = " freescale/imx93-11x11-evk-lvds-it6263.dtb"
