# Distro configuration for Qtui minimal embedded systems
require conf/distro/poky.conf
require conf/distro/include/qtui-features.inc

DISTRO = "qtui-minimal"
DISTRO_NAME = "Qtui Minimal Linux (Headless & Console QML)"
DISTRO_VERSION = "1.0.0"
DISTRO_CODENAME = "scarthgap"

# Default init manager: systemd (fast boot, service supervision, networkd)
INIT_MANAGER = "systemd"

# Default root password policy: secure for production (disabled by default)
# For development builds with empty root password, add 'debug-tweaks' to IMAGE_FEATURES
IMAGE_FEATURES[validitems] += "debug-tweaks"

# Use musl or glibc; glibc is default in poky
TCLIBC = "glibc"

# Package format
PACKAGE_CLASSES = "package_ipk"
