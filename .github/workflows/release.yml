name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag & extract release notes
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      pkg_tag: ${{ steps.meta.outputs.pkg_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Check REUSE licensing compliance
        uses: fsfe/reuse-action@v5

      - name: Verify git tag matches CMakeLists.txt version
        id: meta
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          cmake_ver=$(sed -nE 's/^project\(qmltui[[:space:]]+VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -n1)
          if [[ -z "$cmake_ver" ]]; then
            echo "Failed to parse project(qmltui VERSION ...) from CMakeLists.txt" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            if [[ "$tag" != "v${cmake_ver}" && "$tag" != v${cmake_ver}-* ]]; then
              echo "Tag '${tag}' does not match CMakeLists.txt version 'v${cmake_ver}'" >&2
              exit 1
            fi
            pkg_tag="$tag"
          else
            pkg_tag="v${cmake_ver}-dryrun"
          fi
          echo "version=${cmake_ver}" >> "$GITHUB_OUTPUT"
          echo "pkg_tag=${pkg_tag}" >> "$GITHUB_OUTPUT"
          python3 - "$tag" "${GITHUB_REPOSITORY}" <<'PY'
          import posixpath, re, sys
          tag, repo = sys.argv[1], sys.argv[2]
          text = open("docs/changes/changelog.md", encoding="utf-8").read()
          def repl(m):
              label, target = m.group(1), m.group(2)
              if re.match(r"^(?:https?:|mailto:|#)", target):
                  return m.group(0)
              path, sep, frag = target.partition("#")
              norm = posixpath.normpath(posixpath.join("docs/changes", path))
              kind = "tree" if path.endswith("/") else "blob"
              return f"[{label}](https://github.com/{repo}/{kind}/{tag}/{norm}{sep}{frag})"
          out = re.sub(r"\[([^\]]+)\]\(([^)]+)\)", repl, text)
          open("release-notes.md", "w", encoding="utf-8").write(out)
          PY

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 5

  runner-cli:
    name: qmltui-runner (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            qt_host: linux
            qt_arch: linux_gcc_64
          - os: macos-latest
            platform: macos-arm64
            qt_host: mac
            qt_arch: clang_64
          - os: windows-2022
            platform: windows-x86_64
            qt_host: windows
            qt_arch: win64_msvc2022_64
    steps:
      - uses: actions/checkout@v4

      - uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt 6.8
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build qmltui-runner
        shell: bash
        run: |
          qt_dir="${{ steps.install-qt.outputs.qt-root-dir }}"
          qt_dir="${qt_dir//\\//}"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${qt_dir}" \
            -DQMLTUI_BUILD_TESTS=OFF \
            -DQMLTUI_BUILD_EXAMPLES=OFF \
            -DQMLTUI_BUILD_BENCHMARKS=OFF \
            -DQMLTUI_ENABLE_PRIVATE_QT=OFF \
            -DQMLTUI_ENABLE_IMAGE=OFF \
            -DQMLTUI_ENABLE_PTYVIEW=OFF \
            -DQMLTUI_ENABLE_RUNNER=ON
          cmake --build build --target qmltui-runner --parallel

      - name: Package archive (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          qt_dir="${{ steps.install-qt.outputs.qt-root-dir }}"
          if ! command -v patchelf >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends patchelf
          fi
          cmake --install build --component runner-cli --prefix stage
          pkg="qmltui-runner-${{ needs.verify.outputs.pkg_tag }}-${{ matrix.platform }}"
          mkdir -p "dist/${pkg}/lib"
          cp stage/bin/qmltui-runner "dist/${pkg}/qmltui-runner"
          cp LICENSE.md THIRD-PARTY.md LICENSES/LGPL-3.0-only.txt "dist/${pkg}/"
          python3 - "$qt_dir" "dist/${pkg}" <<'PY'
          import os, pathlib, shutil, subprocess, sys

          ICU_NOTICE = """Unicode License v3 / ICU License Notice
          (Applies to bundled libicu* shared libraries shipped with Qt 6)

          Copyright (c) 2016 and later: Unicode, Inc. and others.
          License & terms of use: http://www.unicode.org/copyright.html

          Copyright (c) 1995-2016 International Business Machines Corporation and others
          All rights reserved.

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, and/or sell copies of the
          Software, and to permit persons to whom the Software is furnished to do so,
          provided that the above copyright notice(s) and this permission notice appear
          in all copies of the Software and that both the above copyright notice(s) and
          this permission notice appear in supporting documentation.

          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
          IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
          FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT OF THIRD PARTY RIGHTS.
          """

          qt_root = pathlib.Path(sys.argv[1]).resolve()
          qt_lib = qt_root / "lib"
          pkg_dir = pathlib.Path(sys.argv[2]).resolve()
          lib_dir = pkg_dir / "lib"

          ldd_env = dict(os.environ)
          existing_ld = ldd_env.get("LD_LIBRARY_PATH", "")
          ldd_env["LD_LIBRARY_PATH"] = f"{qt_lib}:{existing_ld}" if existing_ld else str(qt_lib)

          seen = set()
          queue = [pkg_dir / "qmltui-runner"]
          while queue:
              binary = queue.pop(0)
              out = subprocess.check_output(["ldd", str(binary)], text=True, env=ldd_env)
              for line in out.splitlines():
                  if "not found" in line:
                      raise RuntimeError(f"Unresolved shared library in {binary}: {line.strip()}")
                  if "=>" not in line:
                      continue
                  rhs = line.split("=>", 1)[1].strip().split()[0]
                  if not rhs.startswith("/"):
                      continue
                  src = pathlib.Path(rhs)
                  try:
                      resolved_src = src.resolve()
                      resolved_src.relative_to(qt_lib)
                  except ValueError:
                      continue
                  soname = line.split("=>", 1)[0].strip()
                  if soname in seen:
                      continue
                  seen.add(soname)
                  dst = lib_dir / soname
                  shutil.copy2(resolved_src, dst)
                  needed = subprocess.check_output(["patchelf", "--print-needed", str(dst)], text=True).strip()
                  if needed:
                      subprocess.run(["patchelf", "--set-rpath", "$ORIGIN", str(dst)], check=True)
                  queue.append(resolved_src)

          bundled = [p.name for p in lib_dir.iterdir()]
          assert any(name.startswith("libQt6Core.so") for name in bundled), "Qt6Core not bundled"
          if any(name.startswith("libicu") for name in bundled):
              (pkg_dir / "ICU-LICENSE.txt").write_text(ICU_NOTICE, encoding="utf-8")
          PY
          patchelf --set-rpath '$ORIGIN/lib' "dist/${pkg}/qmltui-runner"
          tar -C dist -czf "dist/${pkg}.tar.gz" "${pkg}"
          smoke=$(mktemp -d)
          trap 'rm -rf "$smoke"' EXIT
          tar -C "$smoke" -xzf "dist/${pkg}.tar.gz"
          ldd_out=$(env -i PATH=/usr/bin:/bin ldd "$smoke/${pkg}/qmltui-runner")
          echo "$ldd_out"
          if echo "$ldd_out" | grep -q "not found"; then
            echo "Missing runtime dependency in Linux archive" >&2
            exit 1
          fi
          if echo "$ldd_out" | grep -qF "$qt_dir"; then
            echo "Archive binary still references CI Qt path: $qt_dir" >&2
            exit 1
          fi
          env -i PATH=/usr/bin:/bin "$smoke/${pkg}/qmltui-runner" --version

      - name: Package archive (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          qt_dir="${{ steps.install-qt.outputs.qt-root-dir }}"
          cmake --install build --component runner-cli --prefix stage
          pkg="qmltui-runner-${{ needs.verify.outputs.pkg_tag }}-${{ matrix.platform }}"
          mkdir -p "dist/${pkg}/Frameworks"
          cp stage/bin/qmltui-runner "dist/${pkg}/qmltui-runner"
          cp LICENSE.md THIRD-PARTY.md LICENSES/LGPL-3.0-only.txt "dist/${pkg}/"
          ditto "${qt_dir}/lib/QtCore.framework" "dist/${pkg}/Frameworks/QtCore.framework"
          rm -rf "dist/${pkg}/Frameworks/QtCore.framework/Headers" \
                 "dist/${pkg}/Frameworks/QtCore.framework/Versions/A/Headers" \
                 "dist/${pkg}/Frameworks/QtCore.framework/Resources/QtCore.prl"
          if otool -L "dist/${pkg}/qmltui-runner" | grep -q "QtNetwork.framework"; then
            ditto "${qt_dir}/lib/QtNetwork.framework" "dist/${pkg}/Frameworks/QtNetwork.framework"
            rm -rf "dist/${pkg}/Frameworks/QtNetwork.framework/Headers" \
                   "dist/${pkg}/Frameworks/QtNetwork.framework/Versions/A/Headers" \
                   "dist/${pkg}/Frameworks/QtNetwork.framework/Resources/QtNetwork.prl"
          fi
          for rpath in $(otool -l "dist/${pkg}/qmltui-runner" | awk '/cmd LC_RPATH/{f=1} f && /path /{print $2; f=0}'); do
            install_name_tool -delete_rpath "$rpath" "dist/${pkg}/qmltui-runner"
          done
          install_name_tool -add_rpath "@executable_path/Frameworks" "dist/${pkg}/qmltui-runner"
          codesign --force --sign - --deep "dist/${pkg}/Frameworks/QtCore.framework"
          if [ -d "dist/${pkg}/Frameworks/QtNetwork.framework" ]; then
            codesign --force --sign - --deep "dist/${pkg}/Frameworks/QtNetwork.framework"
          fi
          codesign --force --sign - "dist/${pkg}/qmltui-runner"
          tar -C dist -czf "dist/${pkg}.tar.gz" "${pkg}"
          smoke=$(mktemp -d)
          trap 'rm -rf "$smoke"' EXIT
          tar -C "$smoke" -xzf "dist/${pkg}.tar.gz"
          if otool -l "$smoke/${pkg}/qmltui-runner" | grep -qF "$qt_dir"; then
            echo "Archive binary still references CI Qt path: $qt_dir" >&2
            exit 1
          fi
          env -i PATH=/usr/bin:/bin "$smoke/${pkg}/qmltui-runner" --version

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --install build --component runner-cli --prefix stage
          $pkg = "qmltui-runner-${{ needs.verify.outputs.pkg_tag }}-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path "dist/$pkg" | Out-Null
          Copy-Item "stage/bin/qmltui-runner.exe" "dist/$pkg/"
          Copy-Item "LICENSE.md", "THIRD-PARTY.md", "LICENSES/LGPL-3.0-only.txt" "dist/$pkg/"
          & "${{ steps.install-qt.outputs.qt-root-dir }}/bin/windeployqt.exe" --release --no-translations --no-compiler-runtime --no-opengl-sw --no-system-d3d-compiler "dist/$pkg/qmltui-runner.exe"
          Compress-Archive -Path "dist/$pkg" -DestinationPath "dist/$pkg.zip"
          $smoke = Join-Path ([System.IO.Path]::GetTempPath()) ("qmltui-smoke-" + [System.Guid]::NewGuid().ToString("N"))
          Expand-Archive -Path "dist/$pkg.zip" -DestinationPath $smoke
          try {
            $oldPath = $env:PATH
            $qtRoot = "${{ steps.install-qt.outputs.qt-root-dir }}" -replace '/', '\'
            $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -and -not $_.StartsWith($qtRoot, [System.StringComparison]::OrdinalIgnoreCase) }) -join ';'
            & (Join-Path $smoke "$pkg/qmltui-runner.exe") --version
            if ($LASTEXITCODE -ne 0) { throw "Windows archive smoke test failed with exit code $LASTEXITCODE" }
          } finally {
            $env:PATH = $oldPath
            Remove-Item -Recurse -Force $smoke
          }

      - name: Upload CLI archive
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 5

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify, runner-cli]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets & checksums
        shell: bash
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release-assets/ \;
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          cp artifacts/release-notes/release-notes.md release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: QmlTui ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ startsWith(needs.verify.outputs.version, '0.') || contains(github.ref_name, '-') }}
          files: release-assets/*

      - name: Trigger website deployment (optional)
        if: env.WEBSITE_DISPATCH_TOKEN != ''
        env:
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        shell: bash
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${WEBSITE_DISPATCH_TOKEN}" \
            "https://api.github.com/repos/qmltui/qmltui.github.io/dispatches" \
            -d "{\"event_type\":\"qmltui-updated\",\"client_payload\":{\"ref\":\"${GITHUB_REF_NAME}\"}}"
