name: CI

# Public CI runs on GitHub-hosted runners (ubuntu-24.04, windows-2022, macos-14)
# by default, installing and caching Qt 6.8 via jurplel/install-qt-action@v4.
#
# Maintainers can optionally route trusted non-fork runs (push, workflow_dispatch,
# and same-repository pull requests) on Linux and Windows to registered
# self-hosted runners by setting repository variable QMLTUI_SELF_HOSTED=1
# (see docs/contributing/ci-runners.md). External fork pull requests always run
# on GitHub-hosted runners.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux / Behavior ${{ matrix.behavior }}
    runs-on: ${{ (vars.QMLTUI_SELF_HOSTED == '1' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted", "linux"]') || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        behavior: ['ON', 'OFF']
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        if: runner.environment != 'self-hosted'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt 6.8
        if: runner.environment != 'self-hosted'
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${QMLTUI_QT_LINUX:-${{ steps.install-qt.outputs.qt-root-dir }}}"
          -DQMLTUI_BUILD_TESTS=ON
          -DQMLTUI_BUILD_EXAMPLES=ON
          -DQMLTUI_ENABLE_RUNNER=ON
          -DQMLTUI_ENABLE_PRIVATE_QT=${{ matrix.behavior }}
          -DQMLTUI_ENABLE_IMAGE=ON
          -DQMLTUI_ENABLE_PTYVIEW=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build -LE Demo --output-on-failure

      - name: Check formatting, docs, and skills
        if: matrix.behavior == 'ON'
        run: |
          export QMLTUI_QT_LINUX="${QMLTUI_QT_LINUX:-${{ steps.install-qt.outputs.qt-root-dir }}}"
          if [ "${RUNNER_ENVIRONMENT:-}" != "self-hosted" ]; then
            if command -v pipx >/dev/null 2>&1; then
              pipx install clang-format==23.1.3
            else
              python3 -m pip install --user --break-system-packages clang-format==23.1.3
            fi
            export PATH="$HOME/.local/bin:$PATH"
            export CLANG_FORMAT="$HOME/.local/bin/clang-format"
          fi
          python3 ./scripts/format.py --check src tools examples tests
          python3 ./scripts/check_docs.py --build-dir build
          python3 ./.agents/skills/qmltui-qml/check-skills.py --build-dir build

  sanitizers:
    name: sanitizers (linux / ASan+UBSan)
    runs-on: ${{ (vars.QMLTUI_SELF_HOSTED == '1' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted", "linux"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        if: runner.environment != 'self-hosted'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt 6.8
        if: runner.environment != 'self-hosted'
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build-asan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_PREFIX_PATH="${QMLTUI_QT_LINUX:-${{ steps.install-qt.outputs.qt-root-dir }}}"
          -DQMLTUI_BUILD_TESTS=ON
          -DQMLTUI_ENABLE_RUNNER=ON
          -DQMLTUI_ENABLE_PRIVATE_QT=ON
          -DQMLTUI_ENABLE_IMAGE=ON
          -DQMLTUI_ENABLE_PTYVIEW=ON

      - name: Build
        run: cmake --build build-asan --parallel 4

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan -LE Demo --output-on-failure

  coverage:
    name: coverage (linux / clang / llvm-cov)
    runs-on: ${{ (vars.QMLTUI_SELF_HOSTED == '1' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted", "linux"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Clang coverage tools
        if: runner.environment != 'self-hosted'
        run: |
          if ! command -v clang++ >/dev/null 2>&1 || ! command -v llvm-cov >/dev/null 2>&1 || ! command -v llvm-profdata >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends clang llvm
          fi

      - name: Install Ninja
        if: runner.environment != 'self-hosted'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt 6.8
        if: runner.environment != 'self-hosted'
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build-coverage -G Ninja
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_PREFIX_PATH="${QMLTUI_QT_LINUX:-${{ steps.install-qt.outputs.qt-root-dir }}}"
          -DQMLTUI_BUILD_TESTS=ON
          -DQMLTUI_BUILD_EXAMPLES=ON
          -DQMLTUI_ENABLE_RUNNER=ON
          -DQMLTUI_ENABLE_PRIVATE_QT=ON
          -DQMLTUI_ENABLE_IMAGE=ON
          -DQMLTUI_ENABLE_PTYVIEW=ON
          -DQMLTUI_ENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build-coverage --parallel 4

      - name: Run tests and generate coverage report
        env:
          QT_QPA_PLATFORM: offscreen
        run: cmake --build build-coverage --target coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build-coverage/coverage/html/
            build-coverage/coverage/coverage.svg
            build-coverage/coverage/summary.md
            build-coverage/coverage/summary.txt
            build-coverage/coverage/summary.json
            build-coverage/coverage/lcov.info
          retention-days: 14

  coverage-badge:
    name: coverage badge (main)
    needs: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download coverage summary and badge
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage-artifact

      - name: Publish coverage badge to badges branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          badge_dir=$(mktemp -d)
          svg_path=$(find coverage-artifact -name coverage.svg -print -quit)
          md_path=$(find coverage-artifact -name summary.md -print -quit)
          cp "$svg_path" "$badge_dir/coverage.svg"
          cp "$md_path" "$badge_dir/summary.md"
          cd "$badge_dir"
          git init -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.svg summary.md
          git commit -m "Update coverage badge (${GITHUB_SHA::7})"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges:refs/heads/badges
          rm -rf "$badge_dir"

  windows:
    name: windows / Behavior ON
    runs-on: ${{ (vars.QMLTUI_SELF_HOSTED == '1' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted", "windows"]') || 'windows-2022' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        if: runner.environment != 'self-hosted'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt 6.8
        if: runner.environment != 'self-hosted'
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: pwsh
        run: |
          $qtPrefix = if ($env:QMLTUI_QT_WINDOWS) { $env:QMLTUI_QT_WINDOWS } else { "${{ steps.install-qt.outputs.qt-root-dir }}" }
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$qtPrefix" `
            -DQMLTUI_BUILD_TESTS=ON `
            -DQMLTUI_BUILD_EXAMPLES=ON `
            -DQMLTUI_ENABLE_RUNNER=ON `
            -DQMLTUI_ENABLE_PRIVATE_QT=ON `
            -DQMLTUI_ENABLE_IMAGE=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        shell: pwsh
        run: |
          # DLLs are found through PATH on Windows: Qt's bin plus every build
          # directory that holds one.
          $qtPrefix = if ($env:QMLTUI_QT_WINDOWS) { $env:QMLTUI_QT_WINDOWS } else { "${{ steps.install-qt.outputs.qt-root-dir }}" }
          $dllDirs = Get-ChildItem -Path build -Recurse -Filter *.dll | ForEach-Object { $_.DirectoryName } | Sort-Object -Unique
          $env:PATH = "$qtPrefix\bin;" + ($dllDirs -join ';') + ";$env:PATH"
          $env:QML2_IMPORT_PATH = "$PWD\build\qml"
          $env:QML_IMPORT_PATH = "$PWD\build\qml"
          $env:QT_FORCE_STDERR_LOGGING = "1"
          ctest --test-dir build -LE Demo --output-on-failure

  macos:
    name: macos / Behavior ON
    # On public repositories, hosted macos-14 runs on every push and pull request.
    # On private forks/mirrors, macOS runs on workflow_dispatch and release tags only.
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQMLTUI_BUILD_TESTS=ON
          -DQMLTUI_BUILD_EXAMPLES=ON
          -DQMLTUI_ENABLE_RUNNER=ON
          -DQMLTUI_ENABLE_PRIVATE_QT=ON
          -DQMLTUI_ENABLE_IMAGE=ON
          -DQMLTUI_ENABLE_PTYVIEW=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build -LE Demo --output-on-failure

  quickstart:
    name: quickstart (FetchContent, standalone)
    runs-on: ${{ (vars.QMLTUI_SELF_HOSTED == '1' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted", "linux"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        if: runner.environment != 'self-hosted'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt 6.8
        if: runner.environment != 'self-hosted'
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: true

      - name: Configure exactly as a newcomer would, against this tree
        # FETCHCONTENT_SOURCE_DIR_QMLTUI is CMake's standard override for a
        # declared dependency; the helloworld files themselves are unchanged.
        run: >
          cmake -S examples/helloworld -B build-qs -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${QMLTUI_QT_LINUX:-${{ steps.install-qt.outputs.qt-root-dir }}}"
          -DFETCHCONTENT_SOURCE_DIR_QMLTUI=${{ github.workspace }}

      - name: Build
        run: cmake --build build-qs --parallel 4

      - name: Run scenario tests
        run: ctest --test-dir build-qs -LE Demo --output-on-failure

      - name: Smoke-run
        # No terminal here: the app must start, render, and keep running until
        # the timeout kills it (exit 124). Any crash or QML load error exits early.
        run: |
          set +e
          timeout 3 ./build-qs/hello_qmltui < /dev/null > run.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "hello_qmltui exited early with code $code"; cat run.log; exit 1
          fi
          grep -q "Hello, QmlTui!" run.log || { echo "no rendered frame in output"; cat run.log | head -c 2000; exit 1; }

  wasm:
    name: wasm (compile-guard, examples/helloworld)
    runs-on: ${{ (vars.QMLTUI_SELF_HOSTED == '1' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted", "linux"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether WebAssembly-relevant files changed
        id: filter
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.ref }}" == refs/tags/* ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi
          if [[ -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base_sha" HEAD | grep -qE '^(CMakeLists\.txt|cmake/(QmlTuiWasm|QmlTuiUtf8proc|QmlTuiConfig)\.cmake(\.in)?|src/QmlTui/(CMakeLists\.txt|Core/|Controls/)|examples/helloworld/|\.github/workflows/ci\.yml$)'; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping Wasm compile-guard (no Wasm-relevant files changed)."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Ninja
        if: steps.filter.outputs.should_run == 'true' && runner.environment != 'self-hosted'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup Emscripten 3.1.56 (Qt 6.8)
        if: steps.filter.outputs.should_run == 'true' && runner.environment != 'self-hosted'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.56'
          actions-cache-folder: emsdk-cache

      - name: Install Qt 6.8 Host (linux_gcc_64)
        if: steps.filter.outputs.should_run == 'true' && runner.environment != 'self-hosted'
        id: qt-host
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: true

      - name: Install Qt 6.8 WebAssembly (wasm_singlethread)
        if: steps.filter.outputs.should_run == 'true' && runner.environment != 'self-hosted'
        id: qt-wasm
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'all_os'
          target: 'wasm'
          arch: 'wasm_singlethread'
          cache: true

      - name: Build examples/helloworld with Qt for WebAssembly
        if: steps.filter.outputs.should_run == 'true'
        shell: bash
        run: |
          qt_wasm_dir="${QMLTUI_QT_WASM:-${{ steps.qt-wasm.outputs.qt-root-dir }}}"
          qt_linux_dir="${QMLTUI_QT_LINUX:-${{ steps.qt-host.outputs.qt-root-dir }}}"
          if [ -z "$qt_wasm_dir" ]; then
            echo "Error: QMLTUI_QT_WASM is not set on the self-hosted runner (see docs/contributing/ci-runners.md)." >&2
            exit 1
          fi
          if ! command -v emcc >/dev/null 2>&1; then
            if [ -n "${EMSDK:-}" ] && [ -f "$EMSDK/emsdk_env.sh" ]; then
              source "$EMSDK/emsdk_env.sh"
            elif [ -f "$HOME/emsdk/emsdk_env.sh" ]; then
              source "$HOME/emsdk/emsdk_env.sh"
            fi
          fi
          qt_host_arg=()
          if [ -n "$qt_linux_dir" ] && [ -d "$qt_linux_dir" ]; then
            qt_host_arg=("-DQT_HOST_PATH=${qt_linux_dir}")
          fi
          cmake -S examples/helloworld -B build-wasm -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$qt_wasm_dir/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            "${qt_host_arg[@]}" \
            -DFETCHCONTENT_SOURCE_DIR_QMLTUI="${{ github.workspace }}"
          cmake --build build-wasm --parallel 4
          test -s build-wasm/hello_qmltui.wasm
          test -s build-wasm/hello_qmltui.js
          test -s build-wasm/hello_qmltui.html

  reuse:
    name: REUSE licensing compliance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5
