# Licensing map for the QmlTui repository, in REUSE.toml form (https://reuse.software).
# Source files carry no per-file header; the license of a file is decided by its
# path below. Later tables win over earlier ones for the same file. Full license
# texts are in LICENSES/. Summary for humans: LICENSE.md.

version = 1
SPDX-PackageName = "QmlTui"
SPDX-PackageSupplier = "Yosri Ayed"
SPDX-PackageDownloadLocation = "https://github.com/qmltui/qmltui"

# Library code: LGPLv3.
[[annotations]]
path = ["src/**", "tests/**", "tools/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Yosri Ayed"
SPDX-License-Identifier = "LGPL-3.0-only"

# Examples and build glue: BSD-3-Clause, so they can be copied without conditions.
[[annotations]]
path = ["examples/**", "cmake/**", "scripts/**", ".github/**", ".agents/**", ".githooks/**", "CMakeLists.txt", "jsconfig.json", ".gitignore", ".clang-format", ".qmlformat.ini", "REUSE.toml"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Yosri Ayed"
SPDX-License-Identifier = "BSD-3-Clause"

# Documentation and repository Markdown notices.
[[annotations]]
path = ["docs/**", "**/*.md"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Yosri Ayed"
SPDX-License-Identifier = "CC-BY-4.0"

# Third-party upstream license notices installed with bundled builds.
[[annotations]]
path = "docs/third-party/utf8proc-LICENSE"
precedence = "override"
SPDX-FileCopyrightText = [
    "2014-2021 Steven G. Johnson, Jiahao Chen, Tony Kelman, Jonas Fonseca, and other contributors",
    "2009, 2013 Public Software Group e. V., Berlin, Germany",
    "1991-2007 Unicode, Inc."
]
SPDX-License-Identifier = "MIT AND Unicode-DFS-2015"

[[annotations]]
path = "docs/third-party/libvterm-LICENSE"
precedence = "override"
SPDX-FileCopyrightText = "2008 Paul Evans <leonerd@leonerd.org.uk>"
SPDX-License-Identifier = "MIT"
