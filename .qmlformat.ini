# QmlTui QML Formatting Configuration
# Retained-mode terminal UI framework (Qt 6.8+, C++17)

[General]
IndentWidth=4
UseTabs=false
MaxColumnWidth=-1
NewlineType=native
NormalizeOrder=false
GroupAttributesTogether=false
ObjectsSpacing=false
FunctionsSpacing=false
SingleLineEmptyObjects=false
SemicolonRule=always
SortImports=false
